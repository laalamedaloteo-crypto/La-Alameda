<section id="galeria" class="gallery">
    <div class="container">
        <div class="gallery__head">
            <div class="gallery__kicker">GALERÍA</div>
            <h2 class="gallery__title">Conocé La Alameda</h2>
        </div>

        <div class="gallery__frame" 
             (touchstart)="onTouchStart($event)" 
             (touchend)="onTouchEnd($event)"
             (wheel)="onWheel($event)">
            <button class="nav prev" type="button" aria-label="Anterior" (click)="prev()">
                ‹
            </button>

            <div class="gallery__media" role="group" aria-label="Galería de imágenes">
                @for (img of images; track trackByIndex($index)) {
                <div class="gallery__item" 
                     [class.active]="$index === index" 
                     [class.prev]="$index === getPrevIndex(index)"
                     [class.next]="$index === getNextIndex(index)"
                     (click)="onItemClick($index)">
                    <img class="gallery__img" [src]="img" alt="Imagen de la galería" loading="lazy" />
                </div>
                }
            </div>

            <button class="nav next" type="button" aria-label="Siguiente" (click)="next()">
                ›
            </button>
        </div>

        <div class="gallery__dots" aria-label="Indicadores">
            @for (img of images; track trackByIndex($index)) {
            <button type="button" class="dot" [class.on]="$index === index" (click)="goTo($index)"
                [attr.aria-label]="'Ir a imagen ' + ($index + 1)">
            </button>
            }
        </div>
    </div>
</section>

@if (isLightboxOpen) {
<div class="lightbox" (click)="closeLightbox()">
    <button class="lightbox__close" aria-label="Cerrar modal" (click)="closeLightbox()">✕</button>
    
    <button class="nav prev lightbox__nav" aria-label="Anterior" (click)="prevLightbox($event)">‹</button>
    
    <div class="lightbox__content" (click)="$event.stopPropagation()">
        <img [src]="images[lightboxIndex]" alt="Imagen ampliada" class="lightbox__img" />
    </div>

    <button class="nav next lightbox__nav" aria-label="Siguiente" (click)="nextLightbox($event)">›</button>
</div>
}
