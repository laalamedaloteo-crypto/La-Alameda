<div class="novedades__section">
  <h3 class="novedades__subtitle"><span class="line"></span> Galería</h3>
  
  <div class="gallery-grid">
    @for (img of galeria; track img; let i = $index) {
      <div class="gallery-item" [ngClass]="'item-' + (i + 1)">
        <img [src]="img" alt="Avance de obra" />
      </div>
    }
  </div>
</div>
