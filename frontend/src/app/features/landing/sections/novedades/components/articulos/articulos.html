<div class="novedades__section">
  <h3 class="novedades__subtitle"><span class="line"></span> Artículos recientes</h3>
  
  <div class="articulos-list">
    @for (item of articulos; track item.title) {
      <article class="card articulo-card">
        <div class="articulo-card__img-wrapper">
          <img [src]="item.image" [alt]="item.title" class="articulo-card__img" />
        </div>
        <div class="articulo-card__content">
          <div class="articulo-card__meta-row">
            <span class="articulo-card__meta-item">
              <svg viewBox="0 0 24 24" class="icon-sm" fill="none"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              {{ item.author }}
            </span>
            <span class="articulo-card__meta-item">
              <svg viewBox="0 0 24 24" class="icon-sm" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 6v6l4 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              {{ item.date }}
            </span>
          </div>
          <h4 class="articulo-card__title">{{ item.title }}</h4>
          <p class="articulo-card__desc">{{ item.description }}</p>
          <a href="javascript:void(0)" class="destacada-card__link">LEER MÁS <svg viewBox="0 0 24 24" class="icon-arrow" fill="none"><path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        </div>
      </article>
    }
  </div>
</div>
