<article class="card" [class.active]="active" (click)="onClick()">
    <div class="top">
        <div class="code">{{ lot.code }}</div>
        @if (lot.status) {
        <ui-badge [status]="lot.status"></ui-badge>
        }
    </div>

    <div class="details">
        <div class="detail-item">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.5"
                fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="10" width="18" height="8" rx="2" ry="2"></rect>
                <line x1="7" y1="10" x2="7" y2="13"></line>
                <line x1="11" y1="10" x2="11" y2="14"></line>
                <line x1="15" y1="10" x2="15" y2="13"></line>
            </svg>
            <span class="detail-text">Superficie: <strong>{{ lot.areaM2 }} m²</strong></span>
        </div>

        <div class="detail-item">
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.5"
                fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <span class="detail-text">Precio: @if (lot.priceUsd) { US$ {{ lot.priceUsd |
                number:'1.0-0' }} } @else { Consultar }</span>
        </div>
    </div>

    @if (lot.description) {
    <div class="description">{{ lot.description }}</div>
    }

    <div class="divider"></div>

    <div class="cta">
        <button class="action-btn">VER EN MAPA</button>
    </div>
</article>
