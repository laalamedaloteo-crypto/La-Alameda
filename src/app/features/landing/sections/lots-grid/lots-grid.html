<div class="carousel">
    <div class="carousel__head">
        <div class="carousel__title">Lotes</div>

        <div class="carousel__nav">
            <button class="navBtn" (click)="scroll('prev')" aria-label="Anterior">‹</button>
            <button class="navBtn" (click)="scroll('next')" aria-label="Siguiente">›</button>
        </div>
    </div>

    <div #track class="track">
        @for (lot of lots; track lot.id) {
        <lot-card [lot]="lot" [active]="selected?.id === lot.id" (select)="onClick($event)">
        </lot-card>
        }
    </div>
</div>
