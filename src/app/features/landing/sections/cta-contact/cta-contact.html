<section id="contacto" class="cta">
    <div class="container cta__wrap">
        <div class="cta__kicker">¿LISTO PARA DAR EL PASO?</div>

        <h2 class="cta__title">Tu nuevo hogar te espera</h2>

        <p class="cta__subtitle">
            Agendá una visita personalizada y conocé La Alameda en persona.
        </p>

        <div class="cta__action">
            <a class="cta__wa" [href]="whatsHref" target="_blank" rel="noopener">
                <span class="cta__waIcon" aria-hidden="true">
                    <!-- WhatsApp icon -->
                    <svg viewBox="0 0 24 24" class="icon" fill="none">
                        <path
                            d="M20.5 11.7c0 4.6-3.8 8.3-8.5 8.3-1.4 0-2.7-.3-3.9-.9L4 20l1-3.7c-.7-1.2-1.1-2.6-1.1-4.1C3.9 7.6 7.7 3.9 12 3.9c4.7 0 8.5 3.7 8.5 7.8Z"
                            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                        <path
                            d="M9.2 8.8c.2-.4.4-.4.7-.4h.5c.1 0 .3 0 .4.3l.7 1.6c.1.2.1.4 0 .6l-.3.5c-.1.2-.1.4 0 .6.3.6 1.2 1.6 2.1 2 .2.1.4 0 .6-.1l.6-.7c.2-.2.4-.2.6-.1l1.7.8c.2.1.3.3.3.5 0 .8-.4 1.5-1.2 1.8-.6.2-1.4.2-2.2 0-1.4-.4-2.9-1.3-4.2-2.6-1.2-1.2-2.1-2.6-2.4-3.9-.2-.8-.1-1.6.2-2.3Z"
                            stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </span>

                <span class="cta__waText">ESCRIBINOS POR WHATSAPP</span>
            </a>
        </div>

        <div class="cta__details">
            <a class="cta__detail" [href]="telHref">
                <span class="miniIcon" aria-hidden="true">
                    <!-- phone -->
                    <svg viewBox="0 0 24 24" class="mini" fill="none">
                        <path d="M7 3h3l1 5-2 1c1 3 3 5 6 6l1-2 5 1v3c0 1-1 2-2 2C10 22 2 14 2 5c0-1 1-2 2-2h3Z"
                            stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </span>
                <span>{{ phoneDisplay }}</span>
            </a>

            <a class="cta__detail" [href]="mailHref">
                <span class="miniIcon" aria-hidden="true">
                    <!-- mail -->
                    <svg viewBox="0 0 24 24" class="mini" fill="none">
                        <path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                        <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                    </svg>
                </span>
                <span>{{ email }}</span>
            </a>
        </div>
    </div>
</section>
