<div class="page centered">
  <div class="card">
    <div class="card-header">
      <h2>Cambiar Contraseña</h2>
      <p *ngIf="step() === 1">Paso 1: Solicitá un código de seguridad a tu mail</p>
      <p *ngIf="step() === 2">Paso 2: Ingresá el código y tu nueva contraseña</p>
    </div>

    <!-- PASO 1 -->
    <div *ngIf="step() === 1" class="step-content">
      <p class="info-text">
        Para tu seguridad, enviaremos un código de 6 dígitos a tu correo electrónico registrado.
      </p>
      <div class="actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="nextStep()" [disabled]="loading()">
          {{ loading() ? 'Enviando...' : 'Enviar Código al Mail' }}
        </button>
      </div>
    </div>

    <!-- PASO 2 -->
    <form *ngIf="step() === 2" (ngSubmit)="onSubmit()" #passwordForm="ngForm">
      <div class="form-group highlight">
        <label for="code">Código de Verificación (Enviado al mail)</label>
        <input type="text" id="code" name="code" [(ngModel)]="code" required placeholder="Ej: 123456" maxlength="6"
          autocomplete="one-time-code">
      </div>

      <div class="form-group">
        <label for="current">Contraseña Actual</label>
        <input type="password" id="current" name="current" [(ngModel)]="currentPassword" required
          placeholder="Clave actual para confirmar identidad">
      </div>

      <hr class="separator">

      <div class="form-group">
        <label for="new">Nueva Contraseña</label>
        <input type="password" id="new" name="new" [(ngModel)]="newPassword" required minlength="6"
          placeholder="Mínimo 6 caracteres">
      </div>

      <div class="form-group">
        <label for="confirm">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirm" name="confirm" [(ngModel)]="confirmPassword" required
          placeholder="Repetí la clave nueva">
      </div>

      <div *ngIf="error()" class="alert alert-danger">
        {{ error() }}
      </div>

      <div *ngIf="success()" class="alert alert-success">
        ¡Contraseña actualizada correctamente! Redirigiendo...
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="!passwordForm.form.valid || loading()">
          {{ loading() ? 'Cambiando...' : 'Cambiar Contraseña' }}
        </button>
      </div>
    </form>
  </div>
</div>
