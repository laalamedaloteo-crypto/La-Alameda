<div class="forgot-container">
    <div class="card">
        <div class="card-header">
            <h2>Recuperar Contraseña</h2>
            <p *ngIf="step() === 1">Ingresá tu correo para recibir un código</p>
            <p *ngIf="step() === 2">Paso 2: Restablecé tu contraseña</p>
        </div>

        <!-- PASO 1: Pedir Mail -->
        <form *ngIf="step() === 1" (ngSubmit)="onRequestCode()" #requestForm="ngForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="tu@email.com">
            </div>

            <div *ngIf="error()" class="alert alert-danger">
                {{ error() }}
            </div>

            <div class="actions">
                <a routerLink="/login" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary" [disabled]="!requestForm.form.valid || loading()">
                    {{ loading() ? 'Enviando...' : 'Pedir Código' }}
                </button>
            </div>
        </form>

        <!-- PASO 2: Resetear -->
        <form *ngIf="step() === 2" (ngSubmit)="onResetPassword()" #resetForm="ngForm">
            <p class="info-text">Se ha enviado un código a <strong>{{ email }}</strong></p>

            <div class="form-group highlight">
                <label for="code">Código de Verificación</label>
                <input type="text" id="code" name="code" [(ngModel)]="code" required maxlength="6"
                    placeholder="Ej: 123456">
            </div>

            <div class="form-group">
                <label for="new">Nueva Contraseña</label>
                <input type="password" id="new" name="new" [(ngModel)]="newPassword" required minlength="6"
                    placeholder="Mínimo 6 caracteres">
            </div>

            <div class="form-group">
                <label for="confirm">Repetir Nueva Contraseña</label>
                <input type="password" id="confirm" name="confirm" [(ngModel)]="confirmPassword" required
                    placeholder="Repetí la clave">
            </div>

            <div *ngIf="error()" class="alert alert-danger">
                {{ error() }}
            </div>

            <div *ngIf="success()" class="alert alert-success">
                ¡Contraseña restablecida! Redirigiendo al login...
            </div>

            <div class="actions">
                <button type="button" class="btn btn-secondary" (click)="step.set(1)">Atrás</button>
                <button type="submit" class="btn btn-primary" [disabled]="!resetForm.form.valid || loading()">
                    {{ loading() ? 'Guardando...' : 'Restablecer Contraseña' }}
                </button>
            </div>
        </form>
    </div>
</div>
